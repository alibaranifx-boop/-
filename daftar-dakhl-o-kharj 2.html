/* ---------------- Jalali <-> Gregorian conversion ---------------- */
function jdiv(a,b){return ~~(a/b);}
function jmod(a,b){return a - ~~(a/b)*b;}
function jalCal(jy){
  var breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  var bl=breaks.length, gy=jy+621, leapJ=-14, jp=breaks[0], jm,jump=0,leap,n,i;
  for(i=1;i<bl;i+=1){
    jm=breaks[i]; jump=jm-jp;
    if(jy<jm) break;
    leapJ=leapJ+jdiv(jump,33)*8+jdiv(jmod(jump,33),4);
    jp=jm;
  }
  n=jy-jp;
  leapJ=leapJ+jdiv(n,33)*8+jdiv(jmod(n,33)+3,4);
  if(jmod(jump,33)===4 && jump-n===4) leapJ+=1;
  var leapG=jdiv(gy,4)-jdiv((jdiv(gy,100)+1)*3,4)-150;
  var march=20+leapJ-leapG;
  if(jump-n<6) n=n-jump+jdiv(jump+4,33)*33;
  leap=jmod(jmod(n+1,33)-1,4);
  if(leap===-1) leap=4;
  return {leap:leap, gy:gy, march:march};
}
function g2d(gy,gm,gd){
  var d=jdiv((gy+jdiv(gm-8,6)+100100)*1461,4)+jdiv(153*jmod(gm+9,12)+2,5)+gd-34840408;
  d=d-jdiv(jdiv(gy+100100+jdiv(gm-8,6),100)*3,4)+752;
  return d;
}
function j2d(jy,jm,jd){
  var r=jalCal(jy);
  return g2d(r.gy,3,r.march)+(jm-1)*31-jdiv(jm,7)*(jm-7)+jd-1;
}
function d2g(jdn){
  var j=4*jdn+139361631;
  j=j+jdiv(jdiv(4*jdn+183187720,146097)*3,4)*4-3908;
  var i=jdiv(jmod(j,1461),4)*5+308;
  var gd=jdiv(jmod(i,153),5)+1;
  var gm=jmod(jdiv(i,153),12)+1;
  var gy=jdiv(j,1461)-100100+jdiv(8-gm,6);
  return {gy:gy,gm:gm,gd:gd};
}
function d2j(jdn){
  var gy=d2g(jdn).gy, jy=gy-621;
  var r=jalCal(jy);
  var jdn1f=g2d(gy,3,r.march);
  var k=jdn-jdn1f, jd,jm;
  if(k>=0){
    if(k<=185){ jm=1+jdiv(k,31); jd=jmod(k,31)+1; return {jy:jy,jm:jm,jd:jd}; }
    else { k-=186; }
  } else { jy-=1; k+=179; if(r.leap===1) k+=1; }
  jm=7+jdiv(k,30); jd=jmod(k,30)+1;
  return {jy:jy,jm:jm,jd:jd};
}
function toJalaali(gy,gm,gd){ return d2j(g2d(gy,gm,gd)); }
function toGregorian(jy,jm,jd){ return d2g(j2d(jy,jm,jd)); }

function daysInJalaliMonth(jy, jm){

function fillDayOptions(jy,jm,keepDay){

  var current = keepDay || parseInt(dDay.value) || 1;
  if(current>count) current=count;
  var opts=[];
  for(var d=1; d<=count; d++) opts.push('<option value="'+d+'">'+toPersianDigits(d)+'</option>');
  dDay.innerHTML = opts.join('');
  dDay.value = current;
}

function fmt(n){ return Math.round(n).toLocaleString('en-US'); }

/* ---------------- Storage ---------------- */
/* Two independent, redundant stores are used side by side (localStorage and
   IndexedDB) since some browsers/extensions disable one but allow the other.
   A manual JSON backup/restore (see exportBackup/importBackup below) is the
   ultimate safety net, since some browsers (notably Safari on iPhone when a
   file is opened via the Files app / a messaging app preview instead of
   through an actual bookmark) give a locally-opened HTML file a fresh,
   throwaway storage area every single time it's opened — no in-page code can
   detect or fix that in advance, so the backup file is the reliable option
   in that situation. */
var STORAGE_KEY = 'dakhl-o-kharj-transactions-v2';
var IDB_NAME = 'dakhl-o-kharj-db';
var IDB_STORE = 'kv';

function idbOpen(){
  return new Promise(function(resolve){
    try{
      if(!window.indexedDB){ resolve(null); return; }
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ resolve(null); };
    }catch(e){ resolve(null); }
  });
}
function idbGet(key){
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      if(!db){ resolve(undefined); return; }
      try{
        var tx = db.transaction(IDB_STORE, 'readonly');
        var req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ resolve(undefined); };
      }catch(e){ resolve(undefined); }
    });
  });
}
function idbSet(key, value){
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      if(!db){ resolve(false); return; }
      try{
        var tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ resolve(false); };
      }catch(e){ resolve(false); }
    });
  });
}

function showStorageWarning(msg){
  var el = document.getElementById('storageWarning');
  el.innerHTML = msg;
  el.style.display = 'block';
}
function hideStorageWarning(){
  document.getElementById('storageWarning').style.display = 'none';
}

/* Self-test run once at startup: actually write, read back, and delete a
   probe value, in both stores. This catches cases where storage is
   outright blocked (private/incognito mode, a locked-down browser policy,
   an extension). It cannot catch the "fresh origin every time the file is
   opened" case, since that only shows up on the NEXT open. */
async function testStorage(){
  var localOk = false, idbOk = false, cloudOk = false;
  try{
    localStorage.setItem('__probe__','1');
    localOk = localStorage.getItem('__probe__')==='1';
    localStorage.removeItem('__probe__');
  }catch(e){ localOk = false; }
  try{
    await idbSet('__probe__','1');
    idbOk = (await idbGet('__probe__')) === '1';
  }catch(e){ idbOk = false; }
  try{
    if(window.storage && typeof window.storage.set === 'function'){
      var r = await window.storage.set('__probe__', '1', false);
      cloudOk = !!r;
    }
  }catch(e){ cloudOk = false; }

  if(!localOk && !idbOk && !cloudOk){
    showStorageWarning(
      '⚠️ ذخیره‌سازی در این مرورگر مسدود است (احتمالاً حالت خصوصی/ناشناس است) — اطلاعات ثبت‌شده با بستن صفحه از بین می‌رود.' +
      ' برای جلوگیری از این مشکل، از دکمه «💾 دریافت فایل پشتیبان» زیر برای ذخیره یک نسخه در گوشی/کامپیوترتان استفاده کنید و در جلسه بعد با «📂 بازگردانی از پشتیبان» آن را برگردانید.'
    );
  } else {
    hideStorageWarning();
  }
  return localOk || idbOk || cloudOk;
}

async function loadTransactions(){
  // If this page is running inside Claude (as an artifact / preview), the
  // window.storage API is the ONLY store that reliably survives closing and
  // reopening it — localStorage/IndexedDB inside that sandbox can reset
  // between visits, which is exactly what was causing rows to vanish.
  // So: check it FIRST and trust it as the source of truth when present.
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      var res = await window.storage.get('transactions_v2', false);
      if(res && res.value){
        var parsed = JSON.parse(res.value);
        if(Array.isArray(parsed)){
          try{ localStorage.setItem(STORAGE_KEY, res.value); }catch(e){}
          try{ await idbSet(STORAGE_KEY, res.value); }catch(e){}
          return parsed;
        }
      }
    }
  }catch(e){ console.error('window.storage read error', e); }

  var fromLocal = null, fromIdb = null;
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw) fromLocal = JSON.parse(raw);
  }catch(e){ console.error('localStorage read error', e); }
  try{
    var idbRaw = await idbGet(STORAGE_KEY);
    if(idbRaw) fromIdb = JSON.parse(idbRaw);
  }catch(e){ console.error('indexedDB read error', e); }

  // If the two stores disagree (e.g. one was cleared but not the other),
  // trust whichever has more rows rather than silently losing data.
  var chosen = fromLocal || [];
  if(fromIdb && fromIdb.length > chosen.length) chosen = fromIdb;

  // Re-sync both stores so they match going forward.
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(chosen)); }catch(e){}
  try{ await idbSet(STORAGE_KEY, JSON.stringify(chosen)); }catch(e){}

  return chosen;
}

async function saveTransactions(list){
  var json = JSON.stringify(list);
  var okCloud = false, okLocal = false, okIdb = false;

  try{
    if(window.storage && typeof window.storage.set === 'function'){
      var result = await window.storage.set('transactions_v2', json, false);
      okCloud = !!result;
    }
  }catch(e){ console.error('window.storage write error', e); }

  try{ localStorage.setItem(STORAGE_KEY, json); okLocal = true; }
  catch(e){ console.error('localStorage write error', e); }
  try{ okIdb = await idbSet(STORAGE_KEY, json); }
  catch(e){ console.error('indexedDB write error', e); }

  if(!okCloud && !okLocal && !okIdb){
    showStorageWarning(
      '⚠️ ذخیره‌سازی انجام نشد — لطفاً از دکمه «💾 دریافت فایل پشتیبان» استفاده کنید تا این ردیف از دست نرود.'
    );
  } else {
    hideStorageWarning();
  }
}

/* ---------------- Backup / Restore (manual, always reliable) ---------------- */
function exportBackup(){
  if(state.transactions.length===0){
    showToast('هنوز ردیفی برای پشتیبان‌گیری ثبت نشده.', true);
    return;
  }
  var payload = {
    app: 'dakhl-o-kharj',
    version: 1,
    exportedAt: new Date().toISOString(),
    transactions: state.transactions
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'dakhl-o-kharj-backup-'+stamp+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  showToast('فایل پشتیبان دانلود شد. آن را جایی امن نگه دارید.', false);
}

function importBackup(file){
  var reader = new FileReader();
  reader.onload = async function(){
    var incoming;
    try{
      var parsed = JSON.parse(reader.result);
      incoming = Array.isArray(parsed) ? parsed : parsed.transactions;
      if(!Array.isArray(incoming)) throw new Error('bad format');
    }catch(e){
      showToast('فایل پشتیبان معتبر نیست.', true);
      return;
    }

    var existingIds = {};
    state.transactions.forEach(function(t){ existingIds[t.id]=true; });
    var added = 0;
    incoming.forEach(function(t){
      if(t && t.id && !existingIds[t.id]){
        state.transactions.push(t);
        existingIds[t.id]=true;
        added++;
      }
    });

    await saveTransactions(state.transactions);
    renderAll();
    showToast(added+' ردیف از فایل پشتیبان بازگردانی شد.', false);
  };
  reader.readAsText(file);
}

async function resetAllData(){
  if(state.transactions.length===0){ showToast('اطلاعاتی برای پاک کردن وجود ندارد.', true); return; }
  if(!confirm('همه ردیف‌های ثبت‌شده (همه ماه‌ها) برای همیشه پاک شوند؟ این کار قابل بازگشت نیست، مگر با فایل پشتیبان.')) return;

  state.transactions = [];
  state.categoryFilter = null;
  exitEditMode();

  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  try{
    var db = await idbOpen();
    if(db){
      var tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(STORAGE_KEY);
    }
  }catch(e){}
  try{
    if(window.storage && typeof window.storage.delete === 'function'){
      await window.storage.delete('transactions_v2', false);
    }
  }catch(e){}

  renderAll();
  showToast('همه اطلاعات پاک شد.', false);
}

  document.getElementById('restoreBtn').addEventListener('click', function(){ document.getElementById('restoreInput').click(); });
  document.getElementById('resetAllBtn').addEventListener('click', function(){ resetAllData(); });

  var deferredInstallPrompt = null;
  var installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    installBtn.style.display = 'inline-block';
  });
  installBtn.addEventListener('click', async function(){
    if(!deferredInstallPrompt) return;
    installBtn.style.display = 'none';
    deferredInstallPrompt.prompt();
    var choice = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    if(choice.outcome === 'accepted'){ showToast('برنامه به صفحه اصلی اضافه شد.', false); }
  });
  window.addEventListener('appinstalled', function(){
    installBtn.style.display = 'none';
    showToast('نصب با موفقیت انجام شد.', false);
  });
  document.getElementById('restoreInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(file) importBackup(file);
    e.target.value = '';
  });

  await testStorage();
  state.transactions = await loadTransactions();
  renderAll();
}

/* ---------------- Add / Delete ---------------- */
function normalizeDigits(str){
  var map={'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9',
           '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
  return String(str).replace(/[۰-۹٠-٩]/g, function(d){ return map[d]; });
}
function parseAmount(raw){
  var cleaned = normalizeDigits(raw).replace(/[,،\s]/g,'').replace(/[^\d.]/g,'');
  return parseFloat(cleaned);
}
function showToast(msg, isError){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ t.className='toast'; }, 2600);
}

async function addTransaction(){
  var type = document.querySelector('input[name="type"]:checked').value;
  var category = document.getElementById('category').value;
  var amountEl = document.getElementById('amount');
  var amount = parseAmount(amountEl.value);
  var jy = parseInt(document.getElementById('dYear').value);
  var jm = parseInt(document.getElementById('dMonth').value);
  var jd = parseInt(document.getElementById('dDay').value);
  var note = document.getElementById('note').value.trim();

  if(!amount || isNaN(amount) || amount<=0){
    amountEl.focus(); amountEl.style.outline='2px solid var(--expense)';
    showToast('مبلغ را درست وارد کنید (فقط عدد).', true);
    return;
  }
  amountEl.style.outline='';

  var g = toGregorian(jy, jm, jd);
  var isoDate = g.gy + '-' + String(g.gm).padStart(2,'0') + '-' + String(g.gd).padStart(2,'0');

  if(state.editingId){
    var idx = state.transactions.findIndex(function(x){ return x.id===state.editingId; });
    if(idx>-1){
      state.transactions[idx] = {
        id: state.editingId, type: type, category: category, amount: amount,
        date: isoDate, note: note
      };
    }
    await saveTransactions(state.transactions);
    showToast('ردیف با موفقیت اصلاح شد.', false);
    exitEditMode();
  } else {
    var tx = {
      id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      type: type, category: category, amount: amount,
      date: isoDate, note: note
    };
    state.transactions.push(tx);
    await saveTransactions(state.transactions);
    showToast('با موفقیت ثبت شد.', false);
  }

  amountEl.value=''; document.getElementById('note').value='';

  state.jy=jy; state.jm=jm;
  renderAll();
}

function editTransaction(id){
  var t = state.transactions.find(function(x){ return x.id===id; });
  if(!t) return;
  state.editingId = id;

  document.querySelector('input[name="type"][value="'+t.type+'"]').checked = true;
  populateCategorySelect(t.type);
  updateToggleStyle();
  document.getElementById('category').value = t.category;
  document.getElementById('amount').value = t.amount;
  document.getElementById('note').value = t.note || '';

  var d = new Date(t.date+'T00:00:00');
  var j = toJalaali(d.getFullYear(), d.getMonth()+1, d.getDate());
  document.getElementById('dYear').value = j.jy;
  document.getElementById('dMonth').value = j.jm;
  fillDayOptions(j.jy, j.jm, j.jd);

  var btn = document.getElementById('addBtn');
  btn.textContent = 'ذخیره اصلاحات';
  btn.classList.add('editing');

  if(!document.getElementById('cancelEditBtn')){
    var cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.id = 'cancelEditBtn';
    cancel.className = 'ghost-btn';
    cancel.style.width = '100%';
    cancel.style.marginTop = '8px';
    cancel.textContent = 'انصراف از اصلاح';
    cancel.addEventListener('click', exitEditMode);
    btn.insertAdjacentElement('afterend', cancel);
  }

  document.querySelector('.form-panel').scrollIntoView({behavior:'smooth', block:'start'});
}

function exitEditMode(){
  state.editingId = null;
  document.getElementById('amount').value = '';
  document.getElementById('note').value = '';
  var btn = document.getElementById('addBtn');
  btn.textContent = 'افزودن به دفتر';
  btn.classList.remove('editing');
  var cancel = document.getElementById('cancelEditBtn');
  if(cancel) cancel.remove();
}

async function deleteTransaction(id){
  if(!confirm('این ردیف حذف شود؟')) return;
  if(state.editingId===id) exitEditMode();
  state.transactions = state.transactions.filter(function(t){ return t.id!==id; });
  await saveTransactions(state.transactions);
  renderAll();
}

/* ---------------- Helpers ---------------- */
function jalaliOf(tx){
  var d = new Date(tx.date+'T00:00:00');
  return toJalaali(d.getFullYear(), d.getMonth()+1, d.getDate());
}
function txInMonth(list, jy, jm){
  return list.filter(function(t){ var j=jalaliOf(t); return j.jy===jy && j.jm===jm; });
}

/* ---------------- Render ---------------- */
function renderAll(){
  document.getElementById('monthLabel').textContent = JMONTHS[state.jm-1] + ' ' + toPersianDigits(state.jy);

  var monthTx = txInMonth(state.transactions, state.jy, state.jm);
  monthTx.sort(function(a,b){ return b.date.localeCompare(a.date); });

  // Each section is independent: a failure in one (e.g. the chart library
  // not loading) must never stop the others — especially the breakdown
  // table and the ledger list — from rendering.
  safeRender('renderSummary', function(){ renderSummary(monthTx); });
  safeRender('renderDonut', function(){ renderDonut(monthTx); });
  safeRender('renderTrend', function(){ renderTrend(); });
  safeRender('renderAnalysis', function(){ renderAnalysis(monthTx); });
  safeRender('renderBreakdown', function(){ renderBreakdown(monthTx); });
  safeRender('renderLedger', function(){ renderLedger(monthTx); });
}

function safeRender(name, fn){
  try{ fn(); }
  catch(e){ console.error(name+' failed', e); }
}

function toggleBreakdown(force){
  var panel = document.getElementById('breakdownPanel');
  var show = typeof force === 'boolean' ? force : !panel.classList.contains('show');
  panel.classList.toggle('show', show);
  document.getElementById('breakdownBtn').classList.toggle('active', show);
  if(show) panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function renderBreakdown(monthTx){
  var expenses = monthTx.filter(function(t){ return t.type==='expense'; });
  var incomes = monthTx.filter(function(t){ return t.type==='income'; });
  renderBreakdownTable('expenseBreakdownTable', EXPENSE_CATS, expenses);
  renderBreakdownTable('incomeBreakdownTable', INCOME_CATS, incomes);
}

function renderBreakdownTable(elId, catList, txList){
  var el = document.getElementById(elId);
  if(txList.length===0){
    el.innerHTML = '<p class="empty-note">ردیفی برای این ماه نیست.</p>';
    return;
  }
  var sorted = txList.slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
  var total = txList.reduce(function(s,t){ return s+t.amount; }, 0);

  var html = '<table class="breakdown-table"><thead><tr><th>تاریخ</th><th>دسته</th><th>توضیح</th><th>مبلغ (تومان)</th></tr></thead><tbody>';
  sorted.forEach(function(t){
    var cat = catById(t.category);
    var j = jalaliOf(t);
    var dateStr = toPersianDigits(j.jd)+' '+JMONTHS[j.jm-1].slice(0,3);
    html += '<tr class="breakdown-row" data-cat="'+cat.id+'">' +
      '<td>'+dateStr+'</td>' +
      '<td>'+cat.icon+' '+cat.label+'</td>' +
      '<td>'+(t.note ? escapeHtml(t.note) : '—')+'</td>' +
      '<td class="num">'+fmt(t.amount)+'</td></tr>';
  });
  html += '<tr class="breakdown-total"><td colspan="3">جمع کل</td><td class="num">'+fmt(total)+'</td></tr>';
  html += '</tbody></table>';
  el.innerHTML = html;

  el.querySelectorAll('.breakdown-row').forEach(function(row){
    row.addEventListener('click', function(){
      var cat = row.getAttribute('data-cat');
      state.categoryFilter = (state.categoryFilter===cat) ? null : cat;
      renderAll();
      document.getElementById('ledgerList').scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

function renderSummary(monthTx){
  var income = monthTx.filter(function(t){return t.type==='income';}).reduce(function(s,t){return s+t.amount;},0);
  var expense = monthTx.filter(function(t){return t.type==='expense';}).reduce(function(s,t){return s+t.amount;},0);
  var balance = income - expense;

  document.getElementById('sumIncome').textContent = fmt(income);
  document.getElementById('sumExpense').textContent = fmt(expense);
  document.getElementById('sumBalance').textContent = fmt(Math.abs(balance)) + (balance<0 ? '-' : '');

  var card = document.getElementById('balanceCard');
  card.classList.toggle('negative', balance<0);
}

function renderDonut(monthTx){
  var expenses = monthTx.filter(function(t){return t.type==='expense';});
  var byCat = {};
  expenses.forEach(function(t){ byCat[t.category]=(byCat[t.category]||0)+t.amount; });
  var labels=[], data=[], colors=[];
  EXPENSE_CATS.forEach(function(c){
    if(byCat[c.id]){ labels.push(c.icon+' '+c.label); data.push(byCat[c.id]); colors.push(c.color); }
  });

  var canvas = document.getElementById('donutChart');
  var legendEl = document.getElementById('donutLegend');

  if(typeof Chart === 'undefined'){
    canvas.style.display='none';
    legendEl.innerHTML='';
    if(!document.getElementById('donutEmpty')){
      var warn=document.createElement('p'); warn.id='donutEmpty'; warn.className='empty-note';
      warn.textContent='نمودار در دسترس نیست (کتابخانه بارگذاری نشد)، اما اطلاعات پایین ثبت و ذخیره شده است.';
      canvas.parentNode.appendChild(warn);
    }
    return;
  }

  var ctx = canvas.getContext('2d');
  if(donutChart) donutChart.destroy();

  if(data.length===0){
    legendEl.innerHTML='';
    ctx.canvas.style.display='none';
    if(!document.getElementById('donutEmpty')){
      var p=document.createElement('p'); p.id='donutEmpty'; p.className='empty-note';
      p.textContent='هنوز هزینه‌ای برای این ماه ثبت نشده.';
      ctx.canvas.parentNode.appendChild(p);
    }
    return;
  }
  var emptyEl=document.getElementById('donutEmpty');
  if(emptyEl) emptyEl.remove();
  ctx.canvas.style.display='block';

  donutChart = new Chart(ctx, {
    type:'doughnut',
    data:{ labels:labels, datasets:[{ data:data, backgroundColor:colors, borderWidth:2, borderColor:'#fff' }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false}, tooltip:{callbacks:{label:function(c){ return c.label+': '+fmt(c.parsed)+' تومان'; }}} } }
  });

  var total = data.reduce(function(a,b){return a+b;},0);
  var catIds = EXPENSE_CATS.filter(function(c){ return byCat[c.id]; }).map(function(c){ return c.id; });
  legendEl.innerHTML = labels.map(function(l,i){
    var pct = Math.round(data[i]/total*100);
    var isActive = state.categoryFilter===catIds[i];
    return '<button class="'+(isActive?'active':'')+'" data-cat="'+catIds[i]+'"><span class="dot" style="background:'+colors[i]+'"></span>'+l+' ('+toPersianDigits(pct)+'%)</button>';
  }).join('');
  legendEl.querySelectorAll('button').forEach(function(btn){
    btn.addEventListener('click', function(){
      var cat = btn.getAttribute('data-cat');
      state.categoryFilter = (state.categoryFilter===cat) ? null : cat;
      renderAll();
    });
  });
}

function renderTrend(){
  var months=[];
  for(var i=5;i>=0;i--){ months.push(shiftJalaliMonth(state.jy, state.jm, -i)); }
  var incomeData = months.map(function(m){
    return txInMonth(state.transactions,m.jy,m.jm).filter(function(t){return t.type==='income';}).reduce(function(s,t){return s+t.amount;},0);
  });
  var expenseData = months.map(function(m){
    return txInMonth(state.transactions,m.jy,m.jm).filter(function(t){return t.type==='expense';}).reduce(function(s,t){return s+t.amount;},0);
  });
  var labels = months.map(function(m){ return JMONTHS[m.jm-1].slice(0,3); });

  var canvas = document.getElementById('trendChart');
  if(typeof Chart === 'undefined'){
    canvas.style.display='none';
    if(!document.getElementById('trendEmpty')){
      var warn=document.createElement('p'); warn.id='trendEmpty'; warn.className='empty-note';
      warn.textContent='نمودار در دسترس نیست (کتابخانه بارگذاری نشد)، اما اطلاعات پایین ثبت و ذخیره شده است.';
      canvas.parentNode.appendChild(warn);
    }
    return;
  }
  var emptyEl=document.getElementById('trendEmpty');
  if(emptyEl) emptyEl.remove();
  canvas.style.display='block';

  var ctx = canvas.getContext('2d');
  if(trendChart) trendChart.destroy();
  trendChart = new Chart(ctx, {
    type:'bar',
    data:{ labels:labels, datasets:[
      { label:'درآمد', data:incomeData, backgroundColor:'#1B4332', borderRadius:5 },
      { label:'هزینه', data:expenseData, backgroundColor:'#B5482A', borderRadius:5 }
    ]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'top', labels:{ font:{family:'Vazirmatn'} } },
        tooltip:{ callbacks:{ label:function(c){ return c.dataset.label+': '+fmt(c.parsed.y)+' تومان'; } } } },
      scales:{ y:{ ticks:{ callback:function(v){ return fmt(v); } } }, x:{ grid:{display:false} } }
    }
  });
}

function renderAnalysis(monthTx){
  var list = document.getElementById('analysisList');
  var expenses = monthTx.filter(function(t){return t.type==='expense';});
  var income = monthTx.filter(function(t){return t.type==='income';}).reduce(function(s,t){return s+t.amount;},0);
  var expenseTotal = expenses.reduce(function(s,t){return s+t.amount;},0);

  var items=[];

  if(expenses.length===0 && income===0){
    items.push('برای این ماه هنوز ردیفی ثبت نشده — با فرم بالا اولین ردیف را اضافه کنید.');
  } else {
    if(expenses.length>0){
      var byCat={};
      expenses.forEach(function(t){ byCat[t.category]=(byCat[t.category]||0)+t.amount; });
      var top = Object.keys(byCat).reduce(function(a,b){ return byCat[a]>byCat[b]?a:b; });
      var pct = Math.round(byCat[top]/expenseTotal*100);
      items.push('بیشترین هزینه در دسته «'+catById(top).label+'» بوده: <span class="num">'+fmt(byCat[top])+'</span> تومان (<span class="num">'+toPersianDigits(pct)+'</span>٪ از کل هزینه‌ها).');
    }

    var prev = shiftJalaliMonth(state.jy, state.jm, -1);
    var prevExpense = txInMonth(state.transactions, prev.jy, prev.jm).filter(function(t){return t.type==='expense';}).reduce(function(s,t){return s+t.amount;},0);
    if(prevExpense>0){
      var diff = expenseTotal - prevExpense;
      var diffPct = Math.round(Math.abs(diff)/prevExpense*100);
      if(diff>0) items.push('هزینه‌های این ماه نسبت به ماه قبل <span class="num">'+toPersianDigits(diffPct)+'</span>٪ بیشتر شده.');
      else if(diff<0) items.push('هزینه‌های این ماه نسبت به ماه قبل <span class="num">'+toPersianDigits(diffPct)+'</span>٪ کمتر شده.');
      else items.push('هزینه‌های این ماه دقیقاً با ماه قبل برابر است.');
    }

    if(income>0){
      var savingRate = Math.round((income-expenseTotal)/income*100);
      if(savingRate>=0) items.push('در این ماه <span class="num">'+toPersianDigits(savingRate)+'</span>٪ از درآمدتان پس‌انداز شده.');
      else items.push('در این ماه هزینه‌ها از درآمد بیشتر بوده و <span class="num">'+toPersianDigits(Math.abs(savingRate))+'</span>٪ بیشتر از درآمد خرج شده.');
    } else if(expenseTotal>0){
      items.push('برای این ماه درآمدی ثبت نشده؛ فقط هزینه ثبت شده است.');
    }
  }

  list.innerHTML = items.map(function(t){ return '<li>'+t+'</li>'; }).join('');
}

function renderLedger(monthTxAll){
  var chip = document.getElementById('filterChip');
  var monthTx = monthTxAll;
  if(state.categoryFilter){
    monthTx = monthTxAll.filter(function(t){ return t.category===state.categoryFilter; });
    document.getElementById('filterChipText').textContent = 'فیلتر: '+catById(state.categoryFilter).icon+' '+catById(state.categoryFilter).label;
    chip.classList.add('show');
  } else {
    chip.classList.remove('show');
  }

  var el = document.getElementById('ledgerList');
  if(monthTx.length===0){
    el.innerHTML = '<p class="empty-note">'+(state.categoryFilter ? 'ردیفی در این دسته برای این ماه نیست.' : 'هنوز ردیفی برای این ماه ثبت نشده — با فرم بالا شروع کنید.')+'</p>';
    return;
  }
  el.innerHTML = monthTx.map(function(t){
    var cat = catById(t.category);
    var j = jalaliOf(t);
    var dateStr = toPersianDigits(j.jd)+' '+JMONTHS[j.jm-1].slice(0,3);
    return '<div class="row">' +
      '<div class="date">'+dateStr+'</div>' +
      '<div class="cat-stamp" style="color:'+cat.color+'">'+cat.icon+'</div>' +
      '<div class="meta"><div class="cat-label">'+cat.label+'</div>' + (t.note ? '<div class="note">'+escapeHtml(t.note)+'</div>' : '') + '</div>' +
      '<div class="amount '+t.type+'">'+(t.type==='income'?'+':'-')+' '+fmt(t.amount)+'</div>' +
      '<button class="edit-btn" onclick="editTransaction(\''+t.id+'\')" aria-label="اصلاح">✎</button>' +
      '<button class="del-btn" onclick="deleteTransaction(\''+t.id+'\')" aria-label="حذف">✕</button>' +
    '</div>';
  }).join('');
}

function buildExportSection(list, type){
  var filtered = list.filter(function(t){ return t.type===type; });
  var sorted = filtered.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  var total = 0;
  var rows = sorted.map(function(t,i){
    var j = jalaliOf(t);
    total += t.amount;
    return {
      'ردیف': i+1,
      'تاریخ شمسی': j.jd+' '+JMONTHS[j.jm-1]+' '+j.jy,
      'دسته': catById(t.category).label,
      'توضیح': t.note || '',
      'مبلغ (تومان)': t.amount
    };
  });
  return {rows:rows, total:total};
}

function downloadXlsx(list, filename){
  if(list.length===0){ showToast('ردیفی برای خروجی گرفتن در این بازه وجود ندارد.', true); return; }

  var expenseSec = buildExportSection(list, 'expense');
  var incomeSec = buildExportSection(list, 'income');

  if(typeof XLSX === 'undefined'){
    downloadCsvFallback(expenseSec, incomeSec, filename);
    return;
  }

  try{
    var wb = XLSX.utils.book_new();

    var summaryRows = [
      {'شرح':'جمع درآمد', 'مبلغ (تومان)': incomeSec.total},
      {'شرح':'جمع هزینه', 'مبلغ (تومان)': expenseSec.total},
      {'شرح':'مانده', 'مبلغ (تومان)': incomeSec.total - expenseSec.total}
    ];
    var wsSummary = XLSX.utils.json_to_sheet(summaryRows);
    wsSummary['!cols'] = [{wch:16},{wch:16}];
    XLSX.utils.book_append_sheet(wb, wsSummary, 'خلاصه');

    var expenseRows = expenseSec.rows.length ? expenseSec.rows : [{'ردیف':'—','تاریخ شمسی':'','دسته':'هزینه‌ای ثبت نشده','توضیح':'','مبلغ (تومان)':''}];
    var wsExpense = XLSX.utils.json_to_sheet(expenseRows);
    wsExpense['!cols'] = [{wch:6},{wch:16},{wch:20},{wch:26},{wch:14}];
    XLSX.utils.book_append_sheet(wb, wsExpense, 'هزینه‌ها');

    var incomeRows = incomeSec.rows.length ? incomeSec.rows : [{'ردیف':'—','تاریخ شمسی':'','دسته':'درآمدی ثبت نشده','توضیح':'','مبلغ (تومان)':''}];
    var wsIncome = XLSX.utils.json_to_sheet(incomeRows);
    wsIncome['!cols'] = [{wch:6},{wch:16},{wch:20},{wch:26},{wch:14}];
    XLSX.utils.book_append_sheet(wb, wsIncome, 'درآمدها');

    XLSX.writeFile(wb, filename);
    showToast('فایل اکسل با '+(expenseSec.rows.length+incomeSec.rows.length)+' ردیف دانلود شد.', false);
  }catch(err){
    console.error('Excel export failed', err);
    downloadCsvFallback(expenseSec, incomeSec, filename);
  }
}

function downloadCsvFallback(expenseSec, incomeSec, filename){
  function esc(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
  var lines = [];
  lines.push('=== هزینه‌ها ===');
  lines.push('ردیف,تاریخ شمسی,دسته,توضیح,مبلغ (تومان)');
  expenseSec.rows.forEach(function(r){
    lines.push([r['ردیف'], esc(r['تاریخ شمسی']), esc(r['دسته']), esc(r['توضیح']), r['مبلغ (تومان)']].join(','));
  });
  lines.push('جمع هزینه,,,,'+expenseSec.total);
  lines.push('');
  lines.push('=== درآمدها ===');
  lines.push('ردیف,تاریخ شمسی,دسته,توضیح,مبلغ (تومان)');
  incomeSec.rows.forEach(function(r){
    lines.push([r['ردیف'], esc(r['تاریخ شمسی']), esc(r['دسته']), esc(r['توضیح']), r['مبلغ (تومان)']].join(','));
  });
  lines.push('جمع درآمد,,,,'+incomeSec.total);

  var csv = '\uFEFF' + lines.join('\r\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/\.xlsx$/,'.csv');
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  showToast('کتابخانه اکسل در دسترس نبود؛ خروجی CSV (قابل باز شدن در اکسل) دانلود شد.', false);
}

/* ---------------- TEXT EXPORT ---------------- */
function buildTextReport(list, title){
  var expenseSec = buildExportSection(list, 'expense');
  var incomeSec = buildExportSection(list, 'income');
  var balance = incomeSec.total - expenseSec.total;

  var byCatExpense = {};
  expenseSec.rows.forEach(function(){}); // no-op, kept for symmetry
  list.filter(function(t){ return t.type==='expense'; }).forEach(function(t){
    var label = catById(t.category).label;
    byCatExpense[label] = (byCatExpense[label]||0) + t.amount;
  });

  var lines = [];
  var line = '——————————————————';
  lines.push('🧾 '+title);
  lines.push(line);
  lines.push('');

  lines.push('💰 جمع درآمد: '+fmt(incomeSec.total)+' تومان');
  lines.push('💸 جمع هزینه: '+fmt(expenseSec.total)+' تومان');
  lines.push((balance>=0 ? '✅ مانده: ' : '⚠️ کسری: ')+fmt(Math.abs(balance))+' تومان');
  lines.push('');

  if(Object.keys(byCatExpense).length){
    lines.push('📊 هزینه‌ها به تفکیک دسته:');
    Object.keys(byCatExpense).sort(function(a,b){ return byCatExpense[b]-byCatExpense[a]; }).forEach(function(label){
      lines.push('  • '+label+': '+fmt(byCatExpense[label])+' تومان');
    });
    lines.push('');
  }

  if(incomeSec.rows.length){
    lines.push(line);
    lines.push('📈 ردیف‌های درآمد ('+incomeSec.rows.length+' مورد):');
    incomeSec.rows.forEach(function(r){
      var noteStr = r['توضیح'] ? ' — '+r['توضیح'] : '';
      lines.push('  '+r['ردیف']+'. '+r['تاریخ شمسی']+' | '+r['دسته']+' | '+fmt(r['مبلغ (تومان)'])+' تومان'+noteStr);
    });
    lines.push('');
  }

  if(expenseSec.rows.length){
    lines.push(line);
    lines.push('📉 ردیف‌های هزینه ('+expenseSec.rows.length+' مورد):');
    expenseSec.rows.forEach(function(r){
      var noteStr = r['توضیح'] ? ' — '+r['توضیح'] : '';
      lines.push('  '+r['ردیف']+'. '+r['تاریخ شمسی']+' | '+r['دسته']+' | '+fmt(r['مبلغ (تومان)'])+' تومان'+noteStr);
    });
    lines.push('');
  }

  if(!incomeSec.rows.length && !expenseSec.rows.length){
    lines.push('ردیفی برای این بازه ثبت نشده.');
  }

  lines.push(line);
  lines.push('تهیه شده با دفتر دخل و خرج');

  return lines.join('\n');
}

function downloadTextFile(text, filename){
  var blob = new Blob(['\uFEFF'+text], {type:'text/plain;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

function exportTextMonth(){
  var monthTx = txInMonth(state.transactions, state.jy, state.jm);
  if(state.categoryFilter){ monthTx = monthTx.filter(function(t){ return t.category===state.categoryFilter; }); }
  if(monthTx.length===0){ showToast('ردیفی برای خروجی گرفتن در این بازه وجود ندارد.', true); return; }
  var title = 'گزارش '+JMONTHS[state.jm-1]+' '+state.jy;
  var text = buildTextReport(monthTx, title);
  downloadTextFile(text, 'dakhl-o-kharj-'+state.jy+'-'+String(state.jm).padStart(2,'0')+'.txt');
  showToast('فایل متنی گزارش دانلود شد.', false);
}

function exportTextAll(){
  if(state.transactions.length===0){ showToast('ردیفی برای خروجی گرفتن وجود ندارد.', true); return; }
  var text = buildTextReport(state.transactions, 'گزارش کل تاریخچه');
  downloadTextFile(text, 'dakhl-o-kharj-history.txt');
  showToast('فایل متنی گزارش دانلود شد.', false);
}

function copyTextMonth(){
  var monthTx = txInMonth(state.transactions, state.jy, state.jm);
  if(state.categoryFilter){ monthTx = monthTx.filter(function(t){ return t.category===state.categoryFilter; }); }
  if(monthTx.length===0){ showToast('ردیفی برای کپی کردن در این بازه وجود ندارد.', true); return; }
  var title = 'گزارش '+JMONTHS[state.jm-1]+' '+state.jy;
  var text = buildTextReport(monthTx, title);

  function fallbackCopy(){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{ document.execCommand('copy'); showToast('متن گزارش کپی شد.', false); }
    catch(e){ showToast('کپی خودکار ممکن نشد؛ متن را دستی کپی کنید.', true); }
    ta.remove();
  }

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      showToast('متن گزارش کپی شد.', false);
    }).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
}

function exportMonth(){
  var monthTx = txInMonth(state.transactions, state.jy, state.jm);
  if(state.categoryFilter){ monthTx = monthTx.filter(function(t){ return t.category===state.categoryFilter; }); }
  downloadXlsx(monthTx, 'dakhl-o-kharj-'+state.jy+'-'+String(state.jm).padStart(2,'0')+'.xlsx');
}

function exportAllHistory(){
  downloadXlsx(state.transactions, 'dakhl-o-kharj-history.xlsx');
}

function toPersianDigits(n){
  var map={'0':'۰','1':'۱','2':'۲','3':'۳','4':'۴','5':'۵','6':'۶','7':'۷','8':'۸','9':'۹'};
  return String(n).replace(/[0-9]/g, function(d){ return map[d]; });
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}
